<!-- peticiones.page.html -->
<ion-content class="peticiones-content">
  <div class="page-wrapper">

    <!-- Header -->
    <div class="page-header">
      <button class="back-btn" (click)="goBack()">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </button>
      <h1>Peticiones</h1>
      <div class="badge" *ngIf="requests.length > 0">{{ requests.length }}</div>
    </div>

    <!-- Cargando -->
    <div class="state-message" *ngIf="loading">
      <ion-spinner name="crescent"></ion-spinner>
      <span>Cargando peticiones...</span>
    </div>

    <!-- Sin peticiones -->
    <div class="state-message" *ngIf="!loading && requests.length === 0">
      <ion-icon name="mail-open-outline"></ion-icon>
      <span>No tienes peticiones pendientes</span>
    </div>

    <!-- Lista de peticiones -->
    <div class="requests-list" *ngIf="!loading && requests.length > 0">
      <p class="list-label">Solicitudes de amistad recibidas</p>

      <div class="request-item" *ngFor="let req of requests">

        <!-- Avatar -->
        <div class="request-avatar" [style.background]="getAvatarColor(req.sender.id)">
          <img *ngIf="req.sender.avatar_url" [src]="req.sender.avatar_url" class="avatar-img"/>
          <ion-icon *ngIf="!req.sender.avatar_url" name="person"></ion-icon>
        </div>

        <!-- Info -->
        <div class="request-info">
          <span class="request-name">{{ req.sender.full_name || req.sender.username }}</span>
          <span class="request-username">@{{ req.sender.username }}</span>
        </div>

        <!-- Botones aceptar / rechazar -->
        <div class="request-actions">
          <button
            class="btn-accept"
            (click)="accept(req)"
            [disabled]="processingIds.includes(req.id)">
            <ion-spinner *ngIf="processingIds.includes(req.id)" name="crescent" class="btn-spinner"></ion-spinner>
            <ion-icon *ngIf="!processingIds.includes(req.id)" name="checkmark-outline"></ion-icon>
          </button>

          <button
            class="btn-reject"
            (click)="reject(req)"
            [disabled]="processingIds.includes(req.id)">
            <ion-icon name="close-outline"></ion-icon>
          </button>
        </div>

      </div>
    </div>

  </div>
</ion-content>
