<ion-content class="home-content">

  <div class="top-nav">
    <div class="nav-user" (click)="toggleStatusMenu()">
      <div class="nav-avatar">
        <img *ngIf="currentUser.photoUrl" [src]="currentUser.photoUrl" class="avatar-img"/>
        <ion-icon *ngIf="!currentUser.photoUrl" name="person"></ion-icon>
        <div class="status-dot" [ngClass]="currentUser.status"></div>
      </div>
      <div class="nav-info">
        <span class="nav-title">{{ currentUser.name }}</span>
        <span class="nav-status">{{ currentUser.bio }}</span>
      </div>

      <div class="status-menu" *ngIf="showStatusMenu" (click)="$event.stopPropagation()">
        <p class="status-label">MY STATUS</p>
        <div class="status-opt" (click)="changeStatus('online')">
          <div class="dot online"></div><span>Online</span>
          <ion-icon name="checkmark" *ngIf="currentUser.status==='online'"></ion-icon>
        </div>
        <div class="status-opt" (click)="changeStatus('away')">
          <div class="dot away"></div><span>Away</span>
          <ion-icon name="checkmark" *ngIf="currentUser.status==='away'"></ion-icon>
        </div>
        <div class="status-opt" (click)="changeStatus('busy')">
          <div class="dot busy"></div><span>Busy</span>
          <ion-icon name="checkmark" *ngIf="currentUser.status==='busy'"></ion-icon>
        </div>
        <div class="status-divider"></div>
        <div class="status-opt" (click)="changeStatus('offline')">
          <div class="dot offline"></div><span>Offline</span>
          <ion-icon name="checkmark" *ngIf="currentUser.status==='offline'"></ion-icon>
        </div>
      </div>
    </div>
    <button class="settings-btn" (click)="goToSettings()">
      <ion-icon name="settings-outline"></ion-icon>
    </button>
  </div>

  <div class="scroll-area">

    <div class="search-row">
      <div class="search-bar">
        <ion-icon name="search-outline"></ion-icon>
        <input type="text" [placeholder]="activeTab === 'chats' ? 'Search contacts...' : 'Search groups...'" [(ngModel)]="searchQuery" (ngModelChange)="onSearch()"/>
      </div>
      <button class="add-btn" (click)="addContact()">
        <ion-icon name="person-add-outline"></ion-icon>
      </button>
    </div>

    <div class="tabs-row">
      <button
        class="tab"
        [class.active]="activeTab === 'chats'"
        (click)="setTab('chats')">
        Chats
      </button>
      <button
        class="tab"
        [class.active]="activeTab === 'grupos'"
        (click)="setTab('grupos')">
        Groups
      </button>
    </div>

    <ng-container *ngIf="activeTab === 'chats'">
      <div class="home-loading" *ngIf="loadingContacts">
        <ion-spinner name="crescent"></ion-spinner>
      </div>
      <ng-container *ngIf="!loadingContacts">
        <ng-container *ngFor="let group of groupedContacts; let gi = index">
          <div class="promo-card" *ngIf="gi === 2">
            <div class="promo-text">
              <h3>Start something new</h3>
              <p>Coordinate your weekend plans in a new group chat.</p>
              <button class="promo-btn" (click)="createGroup()">Create Group</button>
            </div>
            <div class="promo-icon">
              <ion-icon name="people-outline"></ion-icon>
            </div>
          </div>
          <div class="contact-card" *ngFor="let c of group.contacts" (click)="openChat(c)">
            <div class="contact-avatar-wrap">
              <div class="contact-avatar" [style.background]="c.avatarColor">
                <img *ngIf="c.photoUrl" [src]="c.photoUrl" class="ca-img"/>
                <ion-icon *ngIf="!c.photoUrl" name="person"></ion-icon>
              </div>
              <div class="status-dot" [ngClass]="c.status"></div>
            </div>
            <div class="contact-info">
              <span class="c-name">{{ c.name }}</span>
              <span class="c-bio">{{ c.bio || getStatusLabel(c.status) }}</span>
            </div>
            <span class="c-time">NOW</span>
          </div>
        </ng-container>
      </ng-container>
    </ng-container>

    <ng-container *ngIf="activeTab === 'grupos'">
      <div class="home-loading" *ngIf="loadingGroups">
        <ion-spinner name="crescent"></ion-spinner>
      </div>
      <ng-container *ngIf="!loadingGroups">
        <ng-container *ngFor="let cat of filteredGroupCategories">
          <div class="category-header" (click)="toggleCategory(cat)">
            <ion-icon [name]="cat.expanded ? 'chevron-down' : 'chevron-forward'"></ion-icon>
            <span>{{ cat.name }} ({{ cat.groups.length }})</span>
          </div>
          <ng-container *ngIf="cat.expanded">
            <div class="contact-card" *ngFor="let g of cat.groups" (click)="openGroup(g)">
              <div class="contact-avatar-wrap">
                <div class="contact-avatar" [style.background]="g.avatarColor">
                  <ion-icon name="people-outline"></ion-icon>
                </div>
              </div>
              <div class="contact-info">
                <span class="c-name">{{ g.name }}</span>
              </div>
            </div>
          </ng-container>
        </ng-container>
      </ng-container>
    </ng-container>

    <div style="height: 80px"></div>
  </div>

  <div class="bottom-nav">
    <button class="bnav-btn active" (click)="goToHome()">
      <ion-icon name="home-outline"></ion-icon>
      <span>Contacts</span>
    </button>
    <button class="bnav-btn" (click)="createGroup()">
      <ion-icon name="people-outline"></ion-icon>
      <span>New Group</span>
    </button>
    <button class="bnav-btn" (click)="goToPeticiones()">
      <ion-icon name="mail-outline"></ion-icon>
      <span>Requests</span>
    </button>
    <button class="bnav-btn" (click)="goToSettings()">
      <ion-icon name="person-circle-outline"></ion-icon>
      <span>Profile</span>
    </button>
  </div>

</ion-content>
