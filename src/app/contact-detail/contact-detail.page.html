<ion-content class="detail-content">
  <div class="page-wrapper">

    <div class="page-header">
      <button class="back-btn" (click)="goBack()">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </button>
      <h1>{{ lang.t('detail_title') }}</h1>
      <div class="header-spacer"></div>
    </div>

    <!-- Hero -->
    <section class="hero">
      <div class="avatar-wrap">
        <div class="avatar-glow"></div>
        <div class="hero-avatar" [style.background]="contact.color">
          <img *ngIf="contact.photo" [src]="contact.photo" class="av-img"/>
          <ion-icon *ngIf="!contact.photo" name="person"></ion-icon>
        </div>
        <div class="status-badge" [ngClass]="contact.status"></div>
      </div>
      <h2 class="hero-name">{{ contact.name }}</h2>
      <div class="hero-meta">
        <span class="status-label" [ngClass]="contact.status">{{ getStatusLabel(contact.status) }}</span>
        <span class="meta-dot"></span>
        <span class="hero-username">@{{ contact.bio || contact.name }}</span>
      </div>
    </section>

    <!-- Quick Actions -->
    <div class="quick-actions">
      <button class="qa-btn">
        <ion-icon name="call-outline"></ion-icon>
        <span>{{ lang.t('detail_audio') }}</span>
      </button>
      <button class="qa-btn">
        <ion-icon name="videocam-outline"></ion-icon>
        <span>{{ lang.t('detail_video') }}</span>
      </button>
    </div>

    <!-- Privacy & Preferences -->
    <div class="section-label">{{ lang.t('detail_privacy') }}</div>
    <div class="action-card">
      <button class="action-row">
        <div class="action-icon">
          <ion-icon name="notifications-off-outline"></ion-icon>
        </div>
        <div class="action-text">
          <p class="action-title">{{ lang.t('detail_mute_notifications') }}</p>
          <p class="action-sub">{{ lang.t('detail_mute_sub') }}</p>
        </div>
        <ion-icon name="chevron-forward-outline" class="action-chevron"></ion-icon>
      </button>
      <div class="card-divider"></div>
      <button class="action-row">
        <div class="action-icon">
          <ion-icon name="images-outline"></ion-icon>
        </div>
        <div class="action-text">
          <p class="action-title">{{ lang.t('detail_shared_media') }}</p>
          <p class="action-sub">{{ lang.t('detail_shared_media_sub') }}</p>
        </div>
        <ion-icon name="chevron-forward-outline" class="action-chevron"></ion-icon>
      </button>
    </div>

    <!-- Danger Zone -->
    <div class="section-label danger-label">{{ lang.t('detail_danger_zone') }}</div>
    <div class="action-card danger-card">
      <button class="action-row danger-row">
        <div class="action-icon danger-icon">
          <ion-icon name="ban-outline"></ion-icon>
        </div>
        <div class="action-text">
          <p class="action-title danger-title">{{ lang.t('detail_block') }}</p>
          <p class="action-sub">{{ lang.t('detail_block_sub') }}</p>
        </div>
      </button>
      <div class="card-divider"></div>
      <button class="action-row danger-row">
        <div class="action-icon danger-icon">
          <ion-icon name="person-remove-outline"></ion-icon>
        </div>
        <div class="action-text">
          <p class="action-title danger-title">{{ lang.t('detail_delete_friendship') }}</p>
          <p class="action-sub">{{ lang.t('detail_delete_sub') }}</p>
        </div>
      </button>
    </div>

    <div class="page-footer">
      <div class="footer-line"></div>
      <ion-icon name="chatbubble" class="footer-icon"></ion-icon>
      <div class="footer-line"></div>
    </div>

  </div>
</ion-content>
