<ion-content class="add-contact-content">
  <div class="page-wrapper">

    <div class="page-header">
      <button class="back-btn" (click)="goBack()">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </button>
      <h1>{{ lang.t('add_title') }}</h1>
    </div>

    <div class="hero-text">
      <h2>{{ lang.t('add_hero_pre') }}<br/><span class="green">{{ lang.t('add_hero_accent') }}</span></h2>
      <p>{{ lang.t('add_hero_sub') }}</p>
    </div>

    <div class="search-bar" [class.focused]="searchQuery.length > 0">
      <ion-icon name="search-outline"></ion-icon>
      <input
        type="text"
        [placeholder]="lang.t('add_placeholder')"
        [(ngModel)]="searchQuery"
        (ngModelChange)="onSearch()"
        #searchInput
      />
      <ion-icon
        name="close-circle"
        class="clear-icon"
        *ngIf="searchQuery.length > 0"
        (click)="clearSearch()">
      </ion-icon>
    </div>

    <div class="loading-state" *ngIf="loading">
      <ion-spinner name="crescent"></ion-spinner>
    </div>

    <ng-container *ngIf="!loading && searchQuery.length < 2">
      <div class="empty-illustration">
        <div class="illustration-circle">
          <div class="chat-badge"><ion-icon name="chatbubble"></ion-icon></div>
          <div class="main-icon"><ion-icon name="person-add-outline"></ion-icon></div>
          <div class="check-badge"><ion-icon name="checkmark"></ion-icon></div>
        </div>
        <h3>{{ lang.t('add_hint_title') }}</h3>
        <p>{{ lang.t('add_hint_sub') }}</p>
      </div>
    </ng-container>

    <div class="empty-state" *ngIf="!loading && searchQuery.length >= 2 && results.length === 0">
      <ion-icon name="search-outline"></ion-icon>
      <p>{{ lang.t('add_no_results') }} "<strong>{{ searchQuery }}</strong>"</p>
    </div>

    <div class="results-list" *ngIf="!loading && results.length > 0">
      <div class="result-card" *ngFor="let user of results">
        <div class="result-avatar" [style.background]="getAvatarColor(user.id)">
          <img *ngIf="user.avatar_url" [src]="user.avatar_url" class="avatar-img"/>
          <ion-icon *ngIf="!user.avatar_url" name="person"></ion-icon>
        </div>
        <div class="result-info">
          <span class="r-name">{{ user.full_name || user.username }}</span>
          <span class="r-user">@{{ user.username }}</span>
        </div>
        <button
          class="action-btn"
          [ngClass]="getButtonClass(user.id)"
          (click)="handleAction(user)"
          [disabled]="loadingIds.includes(user.id)">
          <ion-spinner *ngIf="loadingIds.includes(user.id)" name="crescent" class="btn-spinner"></ion-spinner>
          <ng-container *ngIf="!loadingIds.includes(user.id)">
            <ng-container [ngSwitch]="userStatuses[user.id]">
              <ion-icon *ngSwitchCase="'none'"         name="person-add-outline"></ion-icon>
              <ion-icon *ngSwitchCase="'pending_sent'" name="time-outline"></ion-icon>
              <ion-icon *ngSwitchCase="'accepted'"     name="checkmark-outline"></ion-icon>
              <ion-icon *ngSwitchDefault               name="person-add-outline"></ion-icon>
            </ng-container>
          </ng-container>
        </button>
      </div>
    </div>

    <div style="height: 40px"></div>
  </div>
</ion-content>
