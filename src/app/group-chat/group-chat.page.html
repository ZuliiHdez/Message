<ion-header class="ion-no-border">
  <div class="chat-header">
    <button class="back-btn" (click)="goBack()">
      <ion-icon name="arrow-back-outline"></ion-icon>
    </button>

    <div class="contact-info">
      <div class="group-avatar" [style.background]="group.color">
        <ion-icon name="people"></ion-icon>
      </div>
      <div class="contact-text">
        <span class="contact-name">{{ group.name }}</span>
        <span class="contact-status">{{ group.memberCount }} miembros</span>
      </div>
    </div>

    <div class="header-actions">
      <button class="icon-btn"><ion-icon name="settings-outline"></ion-icon></button>
    </div>
  </div>
</ion-header>

<ion-content class="chat-content" #scrollContent>

  <div class="messages-container" #messagesContainer>
    <ng-container *ngFor="let group of messageGroups">

      <div class="date-separator">
        <span>{{ group.date | uppercase }}</span>
      </div>

      <ng-container *ngFor="let msg of group.messages">
        <div class="message-row" [ngClass]="msg.isMine ? 'mine' : 'theirs'">

          <div class="sender-avatar" *ngIf="!msg.isMine" [style.background]="msg.senderColor">
            <img *ngIf="msg.senderPhoto" [src]="msg.senderPhoto" class="av-img"/>
            <ion-icon *ngIf="!msg.senderPhoto" name="person"></ion-icon>
          </div>

          <div class="bubble-col" [ngClass]="msg.isMine ? 'mine' : 'theirs'">
            <span class="sender-label" *ngIf="!msg.isMine">{{ msg.senderName }}</span>
            <div class="bubble" [class.image-bubble]="msg.image_url">
              <img *ngIf="msg.image_url" [src]="msg.image_url" class="msg-image" (click)="openImage(msg.image_url)"/>
              <p *ngIf="msg.content">{{ msg.content }}</p>
              <span class="msg-time">{{ msg.time }}</span>
            </div>
          </div>

        </div>
      </ng-container>

    </ng-container>
  </div>

</ion-content>

<ion-footer class="ion-no-border chat-footer">

  <div class="image-preview" *ngIf="selectedImage">
    <img [src]="selectedImageUrl"/>
    <button class="remove-image" (click)="removeImage()">
      <ion-icon name="close-circle"></ion-icon>
    </button>
  </div>

  <div class="input-area">
    <div class="toolbar">
      <button class="tool-btn" (click)="pickImage()">
        <ion-icon name="image-outline"></ion-icon>
        <input type="file" #fileInput accept="image/*" (change)="onImageSelected($event)" style="display:none"/>
      </button>
      <button class="tool-btn">
        <ion-icon name="happy-outline"></ion-icon>
      </button>
    </div>

    <div class="input-row">
      <div class="input-box">
        <input
          type="text"
          placeholder="Message the group..."
          [(ngModel)]="messageText"
          (keyup.enter)="sendMessage()"
        />
      </div>
      <button class="send-btn" (click)="sendMessage()" [disabled]="sending">
        <ion-icon name="send"></ion-icon>
      </button>
    </div>
  </div>

</ion-footer>
