<ion-content class="edit-content">
  <div class="edit-wrapper">

    <div class="edit-header">
      <button class="back-btn" (click)="goBack()">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </button>
      <h1>Edit Profile</h1>
    </div>

    <div class="avatar-section">
      <div class="avatar-ring" (click)="pickAvatar()">
        <div class="avatar-circle">
          <img *ngIf="photoUrl" [src]="photoUrl" class="avatar-img"/>
          <ion-icon *ngIf="!photoUrl" name="person-outline"></ion-icon>
        </div>
        <div class="status-badge online"></div>
        <input type="file" #avatarInput accept="image/*" (change)="onAvatarSelected($event)" style="display:none"/>
      </div>
      <a class="change-photo-link">Change profile picture</a>
    </div>

    <div class="form-card">
      <div class="field-group">
        <label>Full Name</label>
        <input type="text" [(ngModel)]="fullName" placeholder="Your name"/>
      </div>

      <div class="field-group">
        <label>Username</label>
        <div class="input-wrap locked">
          <ion-icon name="lock-closed-outline" class="lock-icon"></ion-icon>
          <input type="text" [(ngModel)]="username" disabled/>
        </div>
        <span class="hint">Usernames are verified and cannot be changed.</span>
      </div>

      <div class="field-group">
        <label>Personal Message</label>
        <input type="text" [(ngModel)]="personalMessage" placeholder="What's on your mind?"/>
      </div>
    </div>

    <button class="btn-primary" (click)="save()" [disabled]="loading">
      <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
      <span *ngIf="!loading">Save Changes</span>
    </button>

    <a class="deactivate-link" (click)="logout()">Log Out</a>

    <div style="height: 40px"></div>
  </div>
</ion-content>
