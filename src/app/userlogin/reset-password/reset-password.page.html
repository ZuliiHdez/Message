<ion-content class="reset-content">
  <div class="reset-wrapper">

    <div class="brand">
      <div class="brand-icon">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <circle cx="14" cy="6" r="2.5" fill="#4A6FA5"/>
          <circle cx="6" cy="18" r="2.5" fill="#4A6FA5"/>
          <circle cx="22" cy="18" r="2.5" fill="#4A6FA5"/>
          <circle cx="14" cy="22" r="2" fill="#4A6FA5"/>
          <line x1="14" y1="6" x2="6" y2="18" stroke="#4A6FA5" stroke-width="1.5"/>
          <line x1="14" y1="6" x2="22" y2="18" stroke="#4A6FA5" stroke-width="1.5"/>
          <line x1="6" y1="18" x2="22" y2="18" stroke="#4A6FA5" stroke-width="1.5"/>
          <line x1="14" y1="22" x2="6" y2="18" stroke="#4A6FA5" stroke-width="1.5"/>
          <line x1="14" y1="22" x2="22" y2="18" stroke="#4A6FA5" stroke-width="1.5"/>
        </svg>
      </div>
      <span class="brand-name">ORION</span>
    </div>

    <div class="shield-icon">
      <ion-icon name="shield-checkmark-outline"></ion-icon>
    </div>

    <div class="page-title">
      <h2>Nueva contraseña</h2>
      <p>Introduce y confirma tu nueva contraseña</p>
    </div>

    <div class="form-card" *ngIf="!passwordChanged">

      <div class="input-group" [class.error]="errors.password">
        <div class="input-icon">
          <ion-icon name="lock-closed-outline"></ion-icon>
        </div>
        <input
          [type]="showPassword ? 'text' : 'password'"
          placeholder="Nueva contraseña"
          class="custom-input"
          [(ngModel)]="password"
          (ngModelChange)="errors.password = ''"
        />
        <div class="input-icon-right" (click)="showPassword = !showPassword">
          <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
        </div>
      </div>
      <span class="error-msg" *ngIf="errors.password">{{ errors.password }}</span>

      <div class="input-group" [class.error]="errors.confirmPassword">
        <div class="input-icon">
          <ion-icon name="lock-closed-outline"></ion-icon>
        </div>
        <input
          [type]="showConfirmPassword ? 'text' : 'password'"
          placeholder="Confirmar contraseña"
          class="custom-input"
          [(ngModel)]="confirmPassword"
          (ngModelChange)="errors.confirmPassword = ''"
        />
        <div class="input-icon-right" (click)="showConfirmPassword = !showConfirmPassword">
          <ion-icon [name]="showConfirmPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
        </div>
      </div>
      <span class="error-msg" *ngIf="errors.confirmPassword">{{ errors.confirmPassword }}</span>

      <div class="strength-bar" *ngIf="password.length > 0">
        <div class="strength-track">
          <div class="strength-fill" [ngClass]="strengthClass" [style.width]="strengthWidth"></div>
        </div>
        <span class="strength-label" [ngClass]="strengthClass">{{ strengthLabel }}</span>
      </div>

      <button class="btn-reset" (click)="resetPassword()" [disabled]="loading">
        <span *ngIf="!loading">Guardar nueva contraseña</span>
        <ion-spinner name="crescent" *ngIf="loading"></ion-spinner>
      </button>

    </div>

    <div class="success-card" *ngIf="passwordChanged">
      <div class="success-icon">
        <ion-icon name="checkmark-circle-outline"></ion-icon>
      </div>
      <h3>¡Contraseña actualizada!</h3>
      <p>Tu contraseña ha sido restablecida correctamente. Ya puedes iniciar sesión.</p>

      <button class="btn-reset" (click)="goToLogin()">
        Iniciar sesión
      </button>
    </div>

  </div>
</ion-content>
