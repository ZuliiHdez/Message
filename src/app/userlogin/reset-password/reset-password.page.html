<ion-content class="reset-content">
  <div class="reset-wrapper">

    <div class="brand-row">
      <div class="brand-icon">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <circle cx="14" cy="6" r="2.5" fill="#003d7c"/>
          <circle cx="6" cy="18" r="2.5" fill="#003d7c"/>
          <circle cx="22" cy="18" r="2.5" fill="#003d7c"/>
          <circle cx="14" cy="22" r="2" fill="#003d7c"/>
          <line x1="14" y1="6" x2="6" y2="18" stroke="#003d7c" stroke-width="1.5"/>
          <line x1="14" y1="6" x2="22" y2="18" stroke="#003d7c" stroke-width="1.5"/>
          <line x1="6" y1="18" x2="22" y2="18" stroke="#003d7c" stroke-width="1.5"/>
          <line x1="14" y1="22" x2="6" y2="18" stroke="#003d7c" stroke-width="1.5"/>
          <line x1="14" y1="22" x2="22" y2="18" stroke="#003d7c" stroke-width="1.5"/>
        </svg>
      </div>
      <span class="brand-name">ORION</span>
    </div>

    <div class="editorial-header">
      <p class="section-tag">{{ lang.t('auth_security_tag') }}</p>
      <h2 class="section-title">
        {{ lang.t('auth_reset_hero') }}<br/><span class="accent">{{ lang.t('auth_reset_hero_accent') }}</span>
      </h2>
      <p class="section-sub">{{ lang.t('auth_reset_sub') }}</p>
    </div>

    <div class="form-card" *ngIf="!passwordChanged">

      <div class="pill-input-wrap" [class.error]="errors.password">
        <ion-icon name="lock-closed-outline" class="pill-icon"></ion-icon>
        <input
          [type]="showPassword ? 'text' : 'password'"
          [placeholder]="lang.t('auth_new_password_placeholder')"
          [(ngModel)]="password"
          (ngModelChange)="errors.password = ''"
        />
        <ion-icon
          [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"
          class="eye-icon"
          (click)="showPassword = !showPassword">
        </ion-icon>
      </div>
      <span class="error-msg" *ngIf="errors.password">{{ errors.password }}</span>

      <div class="pill-input-wrap" [class.error]="errors.confirmPassword">
        <ion-icon name="lock-closed-outline" class="pill-icon"></ion-icon>
        <input
          [type]="showConfirmPassword ? 'text' : 'password'"
          [placeholder]="lang.t('auth_confirm_password_placeholder')"
          [(ngModel)]="confirmPassword"
          (ngModelChange)="errors.confirmPassword = ''"
        />
        <ion-icon
          [name]="showConfirmPassword ? 'eye-off-outline' : 'eye-outline'"
          class="eye-icon"
          (click)="showConfirmPassword = !showConfirmPassword">
        </ion-icon>
      </div>
      <span class="error-msg" *ngIf="errors.confirmPassword">{{ errors.confirmPassword }}</span>

      <div class="strength-bar" *ngIf="password.length > 0">
        <div class="strength-track">
          <div class="strength-fill" [ngClass]="strengthClass" [style.width]="strengthWidth"></div>
        </div>
        <span class="strength-label" [ngClass]="strengthClass">{{ strengthLabel }}</span>
      </div>

      <button class="btn-primary" (click)="resetPassword()" [disabled]="loading">
        <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
        <span *ngIf="!loading">{{ lang.t('auth_save_password') }}</span>
      </button>

    </div>

    <div class="success-card" *ngIf="passwordChanged">
      <div class="success-icon">
        <ion-icon name="checkmark-circle-outline"></ion-icon>
      </div>
      <h3>{{ lang.t('auth_all_done') }}</h3>
      <p>{{ lang.t('auth_password_updated') }}</p>

      <button class="btn-primary" (click)="goToLogin()">
        {{ lang.t('auth_sign_in') }}
      </button>
    </div>

  </div>
</ion-content>
