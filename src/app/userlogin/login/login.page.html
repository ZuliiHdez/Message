<ion-content class="login-content">
  <div class="login-wrapper">

    <div class="logo-section">
      <div class="logo-orion">
        <img src="/assets/logo.png" alt="Logo">
      </div>
      <h1 class="logo-title">ORION</h1>
      <p class="logo-sub">THE NEW MESSENGER</p>
    </div>

    <div class="login-card">
      <h2 class="card-title">{{ lang.t('auth_login_title') }}</h2>

      <div class="field-group">
        <label>{{ lang.t('auth_email_label') }}</label>
        <div class="input-wrap">
          <ion-icon name="at-outline" class="input-icon"></ion-icon>
          <input type="email" placeholder="messenger@orion.com" [(ngModel)]="email"/>
        </div>
      </div>

      <div class="field-group">
        <label>{{ lang.t('auth_password_label') }}</label>
        <div class="input-wrap">
          <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
          <input [type]="showPassword ? 'text' : 'password'" placeholder="••••••••" [(ngModel)]="password"/>
          <ion-icon
            [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"
            class="input-icon-right"
            (click)="showPassword = !showPassword">
          </ion-icon>
        </div>
      </div>

      <div class="row-actions">
        <label class="remember-me">
          <input type="checkbox" [(ngModel)]="rememberMe"/>
          <span>{{ lang.t('auth_remember_me') }}</span>
        </label>
        <a class="forgot-link" (click)="goToForgot()">{{ lang.t('auth_forgot_password') }}</a>
      </div>

      <button class="btn-primary" (click)="login()" [disabled]="loading">
        <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
        <span *ngIf="!loading">{{ lang.t('auth_sign_in') }}</span>
      </button>

      <p class="error-msg" *ngIf="errorMsg">{{ errorMsg }}</p>
    </div>

    <div class="login-footer">
      <p>{{ lang.t('auth_no_account') }} <a (click)="goToRegister()">{{ lang.t('auth_create_account') }}</a></p>
    </div>

  </div>
</ion-content>
