<ion-content class="forgot-content">
  <div class="forgot-wrapper">

    <div class="brand-row">
      <div class="brand-icon">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <circle cx="14" cy="6" r="2.5" fill="#003d7c"/>
          <circle cx="6" cy="18" r="2.5" fill="#003d7c"/>
          <circle cx="22" cy="18" r="2.5" fill="#003d7c"/>
          <circle cx="14" cy="22" r="2" fill="#003d7c"/>
          <line x1="14" y1="6" x2="6" y2="18" stroke="#003d7c" stroke-width="1.5"/>
          <line x1="14" y1="6" x2="22" y2="18" stroke="#003d7c" stroke-width="1.5"/>
          <line x1="6" y1="18" x2="22" y2="18" stroke="#003d7c" stroke-width="1.5"/>
          <line x1="14" y1="22" x2="6" y2="18" stroke="#003d7c" stroke-width="1.5"/>
          <line x1="14" y1="22" x2="22" y2="18" stroke="#003d7c" stroke-width="1.5"/>
        </svg>
      </div>
      <span class="brand-name">ORION</span>
    </div>

    <div class="editorial-header">
      <p class="section-tag">Account Recovery</p>
      <h2 class="section-title">
        Forgot your<br/><span class="accent">password?</span>
      </h2>
      <p class="section-sub">Enter your email and we'll send you a reset link.</p>
    </div>

    <div class="form-card" *ngIf="!emailSent">

      <div class="pill-input-wrap" [class.error]="errorMsg">
        <ion-icon name="mail-outline" class="pill-icon"></ion-icon>
        <input
          type="email"
          placeholder="your@email.com"
          [(ngModel)]="email"
          (ngModelChange)="errorMsg = ''"
        />
      </div>
      <span class="error-msg" *ngIf="errorMsg">{{ errorMsg }}</span>

      <button class="btn-primary" (click)="sendResetEmail()" [disabled]="loading">
        <ion-spinner *ngIf="loading" name="crescent"></ion-spinner>
        <span *ngIf="!loading">Send Reset Link</span>
      </button>

      <a class="back-link" (click)="goToLogin()">
        <ion-icon name="arrow-back-outline"></ion-icon>
        Back to sign in
      </a>

    </div>

    <div class="success-card" *ngIf="emailSent">
      <div class="success-icon">
        <ion-icon name="checkmark-circle-outline"></ion-icon>
      </div>
      <h3>Check your inbox</h3>
      <p>We sent a reset link to <strong>{{ email }}</strong>. Follow the link to set a new password.</p>
      <p class="spam-hint">Can't find it? Check your spam folder.</p>

      <button class="btn-primary" (click)="goToLogin()">
        Back to sign in
      </button>
    </div>

  </div>
</ion-content>
